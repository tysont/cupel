# ABOUTME: Continuous integration: `make check` on Linux and macOS with every test runner and coverage tool installed, and
# ABOUTME: `make dogfood` (Cupel's own gate) for every push and pull request. Rust comes from rust-toolchain.toml.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The test runners the runner producers' integration tests drive for real (P3.1); without
      # them those tests report SKIPPED instead of running.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The coverage tools the coverage producers' integration tests drive for real (P3.2, ADR-077).
      - name: Install cargo-llvm-cov and llvm-tools-preview
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Add llvm-tools-preview
        run: rustup component add llvm-tools-preview
      # Pinned to the Go release the coverage fixtures' committed coverprofile and the real-tool
      # tests' block counts come from: coverprofile block boundaries differ between Go releases.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      # Per-test coverage (P3.3): the per-test map producers' integration tests drive
      # cargo-llvm-cov (with the LLVM tools) and pytest-cov for real.
      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Install pytest-cov
        run: python -m pip install pytest-cov
      - name: Install pytest and pytest-cov
        run: python -m pip install pytest pytest-cov
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install vitest, its v8 coverage provider, and jest
        run: npm install --global vitest @vitest/coverage-v8 jest
      - name: make check
        run: make check

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--changed` diffs against the merge base with main, so the history must be there.
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Local main branch for --changed
        if: github.ref != 'refs/heads/main'
        run: git branch --force main origin/main
      - name: make dogfood (changed gate)
        if: github.ref != 'refs/heads/main'
        run: make dogfood
      - name: make dogfood (tree gate on main, which has no merge base to diff against)
        if: github.ref == 'refs/heads/main'
        run: make dogfood DOGFOOD_SCOPE=tree
