# ABOUTME: Continuous integration: `make check` and `make parity` on Linux and macOS with every test runner, coverage tool, property framework, analyzer, race detector, fuzzer, bench tool, contract library, and JVM build tool
# ABOUTME: installed, `make dogfood` (Cupel's own gate at `--depth deep`, ADR-129) for every push and pull request, and the installer tests (ADR-125). Rust comes from rust-toolchain.toml.
# The tools every job but installers needs come from .github/actions/tools (ADR-129, ADR-139).
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/tools
      - name: make check
        run: make check
      # Every golden-harness run again through the daemon, compared with the cold run (ADR-085 §11).
      - name: make parity
        run: make parity

  # Cupel's own gate at `--depth deep` (ADR-129): the suite runs once under instrumentation for
  # coverage and the per-test map, and the changed gate mutates every function of every changed
  # file, each mutant built in one of two slots (`[lang.rust] mutation`) that each hold a build of
  # the workspace, so the runner's preinstalled SDKs are removed for the disk. Debug info is off,
  # as in the measurements, which keeps those builds smaller and faster.
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # `--changed` diffs against the merge base with main, so the history must be there.
          fetch-depth: 0
      - name: Free disk space for the mutation slots
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The deep run executes the suite under coverage as its baseline, so the dogfood needs every
      # tool `make check` needs, not only the runner and coverage tool cupel.toml names (ADR-084).
      - uses: ./.github/actions/tools
      - name: Local main branch for --changed
        if: github.ref != 'refs/heads/main'
        run: git branch --force main origin/main
      - name: make dogfood (changed gate)
        if: github.ref != 'refs/heads/main'
        run: make dogfood DOGFOOD_BUDGET=
      - name: make dogfood (tree gate on main, which has no merge base to diff against)
        if: github.ref == 'refs/heads/main'
        run: make dogfood DOGFOOD_SCOPE=tree DOGFOOD_BUDGET=

  # The installers under dist/ (ADR-125) on an image with only Rust, Node, Python, and ShellCheck added:
  # install.sh, the Homebrew formula, and the npm and pipx wrappers against a fake release served
  # locally. INSTALLER_TESTS_REQUIRE_TOOLS turns a test's missing tool into a failure, not a skip.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install ShellCheck 0.11.0
        run: |
          case "$RUNNER_OS-$(uname -m)" in
            Linux-*) asset=shellcheck-v0.11.0.linux.x86_64.tar.xz ;;
            macOS-arm64) asset=shellcheck-v0.11.0.darwin.aarch64.tar.xz ;;
            *) asset=shellcheck-v0.11.0.darwin.x86_64.tar.xz ;;
          esac
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$asset" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: make installers
        run: make installers
        env:
          INSTALLER_TESTS_REQUIRE_TOOLS: "1"
      # Homebrew's own style check of the formula rendered from the fixture SHA256SUMS. It is rendered
      # under a Formula/ directory, as a tap holds it: Homebrew's RuboCop config exempts formulae from
      # the Sorbet sigil and frozen-string-literal cops by that path alone.
      - name: brew style
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/Formula"
          sh dist/homebrew/render.sh 0.1.0 crates/cupel-cli/tests/fixtures/SHA256SUMS > "$RUNNER_TEMP/Formula/cupel.rb"
          brew style "$RUNNER_TEMP/Formula/cupel.rb"
