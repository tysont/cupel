# ABOUTME: Publishes Cupel's JSON Schemas on GitHub Pages (ADR-127): on a push to `main`, builds cupel, writes every schema it
# ABOUTME: emits with scripts/schemas.sh at the path its `$id` names under https://tysont.github.io/cupel/, and deploys the site.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time: a later push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Build cupel
        run: cargo build --locked --package cupel-cli
      - name: Write the schemas
        run: scripts/schemas.sh target/debug/cupel _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # A `workflow_dispatch` on another branch builds the site but never deploys it.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
