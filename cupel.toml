# Cupel configuration, written by `cupel init`; `cupel describe schema config` documents every key.
default_branch = "main"
depth = "standard"

# The fixture crate's repositories are analysis data for Cupel's tests, not Cupel's code
# (ADR-065); the whole crate is left out so the dogfood grades the six product crates.
[scope]
exclude = ["crates/cupel-fixtures/**"]

# nextest runs each test in its own process and narrows to tests by a filterset, so mutants run
# only the tests a per-test map says cover them (ADR-083); `make test` keeps `cargo test`.
[lang.rust]
runner = "cargo-nextest"
test = "cargo nextest run --workspace"
coverage = "cargo llvm-cov --lcov --output-path {out}"
bench = "cargo bench --bench {name} -- --save-baseline {id}"

# The deep checks' rules (ADR-129) sit at the strictest values the tree sustains: on the tree,
# line coverage of at least 0.96 (it measures 0.968); on a change, no changed function without
# coverage (a change with no instrumented line has a line ratio of 0, so the ratio cannot be its
# rule) and 80% of its mutants killed; on both, CRAP at most 20 (the tree's maximum), no analyzer
# finding, no falsified property, and no contract violated. `perf.bench` has no benchmark to
# compare yet and `gen.fuzz` no target, so neither has a rule.
[gate.changed]
"tests.weakening" = "none"
"static.complexity" = "none"
"static.complexity.cyclomatic_max" = "<= 10"
"static.clones" = "none"
"static.deps" = "none"
"static.deps.cycles" = "== 0"
"static.dead-code" = "none"
"tests.quality" = "none"
"static.analyze" = "none"
"tests.coverage" = "none"
"static.crap.max" = "<= 20"
"tests.mutation.score" = ">= 0.80"
"gen.property.falsified" = "== 0"
"spec.contracts" = "none"

# The clone ratchets compare with the committed baseline (`.cupel/baseline.json`, the last tree
# run on `main` that `make baseline` exported; ADR-140): the tree gate holds the clone groups,
# mostly per-language test scaffolding and same-shape data variants, from growing while the
# changed gate admits no new ones, and a commit that removes some refreshes the baseline.
[gate.tree]
"static.complexity" = "none"
"static.complexity.cyclomatic_max" = "<= 10"
"static.clones.pairs" = "<= base"
"static.clones.clusters" = "<= base"
"static.deps" = "none"
"static.deps.cycles" = "== 0"
"static.dead-code" = "none"
"tests.quality" = "none"
"static.analyze" = "none"
"tests.coverage.line" = ">= 0.96"
"static.crap.max" = "<= 20"
"gen.property.falsified" = "== 0"
"spec.contracts" = "none"
