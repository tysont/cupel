# ABOUTME: Manifest for cupel-fixtures: fixture repositories, golden envelopes, and the harness that runs them.
# ABOUTME: A dev-dependency of other Cupel crates; never shipped in the `cupel` binary.
[package]
name = "cupel-fixtures"
description = "Fixture repositories, golden envelopes, and the harness that compares them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The Rust reference plugins (ADR-092): protocol speakers that depend on serde_json alone.
[[bin]]
name = "cupel-check-ref-rust"
path = "plugins/rust/check.rs"

[[bin]]
name = "cupel-produce-ref-rust"
path = "plugins/rust/produce.rs"

[dependencies]
cupel-adapt.workspace = true
cupel-mutate.workspace = true
cupel-checks.workspace = true
cupel-core.workspace = true
cupel-lang.workspace = true
cupel-plugin.workspace = true
cupel-serve.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
assert_cmd.workspace = true
similar.workspace = true
tempfile.workspace = true

[lints]
workspace = true
