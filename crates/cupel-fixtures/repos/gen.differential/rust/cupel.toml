# gen.differential's fixture (ADR-094 §7): `quarter` rounds down, and the oracle, awk's `int`,
# rounds toward zero, so the two first differ at -1. They agree on the known inputs.
[oracles.quarter]
kind = "command"
cmd = "awk -v cents={input} 'BEGIN { print int(cents / 4) }'"
inputs = ["7", "-8"]

[lang.rust]
differential_entries = ["src/lib.rs:quarter"]
