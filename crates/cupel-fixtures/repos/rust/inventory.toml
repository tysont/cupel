# Maps every construct of every conformance inventory (conformance/<fact>.toml) to code in this
# repository that exhibits it, or marks it not-applicable with a reason.

[symbols.function]
file = "src/lib.rs"
name = "balance"

[symbols.method]
file = "src/account.rs"
name = "account::Account::deposit"

[symbols.static-method]
file = "src/account.rs"
name = "account::Account::new"

[symbols.nested-function]
file = "src/account.rs"
name = "account::Account::statement::line"

[symbols.closure]
file = "src/account.rs"
name = "account::Account::statement::header"

[symbols.public]
file = "src/lib.rs"
name = "balance"

[symbols.internal]
file = "src/lib.rs"
name = "audit_limit"

[symbols.private]
file = "src/lib.rs"
name = "scale"

[symbols.file-namespace]
file = "src/report/format.rs"
name = "report::format::render"
expect = { namespace = "report::format" }

[decisions.if]
file = "src/decide.rs"
name = "decide::classify"

[decisions.else-if]
file = "src/decide.rs"
name = "decide::classify"
expect = { nesting = 0, cognitive = 1 }

[decisions.nested]
file = "src/decide.rs"
name = "decide::first_overdraft"
expect = { kind = "branch", nesting = 1 }

[decisions.loop]
file = "src/decide.rs"
name = "decide::first_overdraft"

[decisions.boolean-op]
file = "src/decide.rs"
name = "decide::classify"

[decisions.early-return]
file = "src/decide.rs"
name = "decide::parse_cents"

[decisions.case]
file = "src/decide.rs"
name = "decide::describe"

[decisions.ternary]
not-applicable = "Rust has no conditional operator; `if` is an expression and is a branch."

[decisions.catch]
not-applicable = "Rust has no exception handlers; errors are values, and `?` is an early return."

[norm-tree.rename]
file = "src/twins.rs"
name = "twins::net_total"
twin = "twins::sum_after_charge"

[norm-tree.literal]
file = "src/twins.rs"
name = "twins::net_total"
twin = "twins::net_total_floor"

[norm-tree.layout]
file = "src/twins.rs"
name = "twins::net_total"
twin = "twins::net_total_laid_out"

[norm-tree.operator]
