# Maps every construct of every conformance inventory (conformance/<fact>.toml) to code in this
# repository that exhibits it, or marks it not-applicable with a reason.

[symbols.function]
file = "ledger.go"
name = "ledger.Balance"

[symbols.method]
file = "ledger.go"
name = "ledger.Account.Deposit"

[symbols.static-method]
not-applicable = "Go methods always have a receiver; package-level functions play the role of static methods."

[symbols.nested-function]
not-applicable = "Go has no named nested functions; a function literal bound to a name is a closure."

[symbols.closure]
file = "ledger.go"
name = "ledger.Account.Statement.header"

[symbols.public]
file = "ledger.go"
name = "ledger.Balance"

[symbols.internal]
file = "ledger.go"
name = "ledger.scale"

[symbols.private]
not-applicable = "Go has no file- or type-private visibility; unexported names are visible throughout the package."

[symbols.file-namespace]
file = "report/format.go"
name = "report.Render"
expect = { namespace = "report" }

[decisions.if]
file = "decide.go"
name = "ledger.classify"

[decisions.else-if]
file = "decide.go"
name = "ledger.classify"
expect = { nesting = 0, cognitive = 1 }

[decisions.nested]
file = "decide.go"
name = "ledger.firstOverdraft"
expect = { kind = "branch", nesting = 1 }

[decisions.loop]
file = "decide.go"
name = "ledger.firstOverdraft"

[decisions.boolean-op]
file = "decide.go"
name = "ledger.classify"

[decisions.early-return]
file = "decide.go"
name = "ledger.parseCents"

[decisions.case]
file = "decide.go"
name = "ledger.describe"

[decisions.ternary]
not-applicable = "Go has no conditional operator; a value chosen by a condition is assigned in an `if`, which is a branch."

[decisions.catch]
not-applicable = "Go has no exception handlers: errors are values tested by `if err != nil` (a branch), and `recover` is an ordinary call in a deferred function whose result is tested by an `if`."
