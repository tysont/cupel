# Maps every construct of every conformance inventory (conformance/<fact>.toml) to code in this
# repository that exhibits it, or marks it not-applicable with a reason.

[symbols.function]
file = "src/math.js"
name = "math.add"

[symbols.method]
file = "src/shapes/geometry.js"
name = "shapes.geometry.Circle.area"

[symbols.static-method]
file = "src/shapes/geometry.js"
name = "shapes.geometry.Circle.unit"

[symbols.nested-function]
file = "src/shapes/geometry.js"
name = "shapes.geometry.perimeter.twice"

[symbols.closure]
file = "src/shapes/geometry.js"
name = "shapes.geometry.scale"

[symbols.public]
file = "src/math.js"
name = "math.add"

[symbols.internal]
not-applicable = "JavaScript modules have no package-level visibility: a name is exported or private to its module."

[symbols.private]
file = "src/shapes/geometry.js"
name = "shapes.geometry.Circle.#isValid"

[symbols.file-namespace]
file = "src/shapes/geometry.js"
name = "shapes.geometry.perimeter"
expect = { namespace = "shapes.geometry" }

[decisions.if]
file = "src/decide.js"
name = "decide.classify"

[decisions.else-if]
file = "src/decide.js"
name = "decide.classify"
expect = { nesting = 0, cognitive = 1 }

[decisions.nested]
file = "src/decide.js"
name = "decide.firstOverdraft"
expect = { kind = "branch", nesting = 1 }

[decisions.loop]
file = "src/decide.js"
name = "decide.firstOverdraft"

[decisions.boolean-op]
file = "src/decide.js"
name = "decide.classify"

[decisions.early-return]
file = "src/decide.js"
name = "decide.parseCents"

[decisions.case]
file = "src/decide.js"
name = "decide.label"

[decisions.ternary]
file = "src/decide.js"
name = "decide.classify"

[decisions.catch]
file = "src/decide.js"
name = "decide.parseCents"

[norm-tree.rename]
file = "src/twins.js"
name = "twins.netTotal"
twin = "twins.sumAfterCharge"

[norm-tree.literal]
file = "src/twins.js"
name = "twins.netTotal"
twin = "twins.netTotalFloor"

[norm-tree.layout]
file = "src/twins.js"
name = "twins.netTotal"
twin = "twins.netTotalLaidOut"

[norm-tree.operator]
file = "src/twins.js"
name = "twins.netTotal"
twin = "twins.netTotalPlus"

[norm-tree.branch]
file = "src/twins.js"
name = "twins.netTotal"
twin = "twins.netTotalCapped"

[norm-tree.call]
file = "src/twins.js"
name = "twins.netTotal"
twin = "twins.netTotalProduct"

[mutation-sites.relational]
file = "src/pricing.js"
name = "pricing.tally"
expect = { from = "<", to = ["<="] }

[mutation-sites.equality]
file = "src/pricing.js"
name = "pricing.discounted"
expect = { from = "!==", to = ["==="] }

[mutation-sites.arith-add-sub]
file = "src/pricing.js"
name = "pricing.tally"
expect = { from = "+=", to = ["-="] }

[mutation-sites.arith-mul-div]
file = "src/pricing.js"
name = "pricing.discounted"
expect = { from = "/", to = ["*"] }

[mutation-sites.boolean-op]
file = "src/pricing.js"
name = "pricing.discounted"
expect = { from = "&&", to = ["||"] }

[mutation-sites.boolean-literal]
file = "src/pricing.js"
name = "pricing.tally"
expect = { from = "false", to = ["true"] }

[mutation-sites.zero-one]
file = "src/pricing.js"
name = "pricing.tally"
expect = { from = "0", to = ["1"] }

[mutation-sites.statement-deletion]
file = "src/pricing.js"
name = "pricing.tally"
expect = { from = "logTotal(total);", to = [""] }

[mutation-sites.return-value]
file = "src/pricing.js"
name = "pricing.discounted"
expect = { from = "price - cut", to = ["undefined"] }

[mutation-sites.constant]
file = "src/pricing.js"
name = "pricing.discounted"
expect = { from = "100", to = ["0"] }

[mutation-sites.boundary]
file = "src/decide.js"
name = "decide.classify"
expect = { from = "0", to = ["0 + 1", "0 - 1"] }

[mutation-sites.negation]
file = "src/pricing.js"
name = "pricing.discounted"
expect = { from = "member && cut !== 0", to = ["!(member && cut !== 0)"] }
