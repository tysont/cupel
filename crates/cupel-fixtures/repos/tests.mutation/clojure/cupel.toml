# The mutation fixture (ADR-080): `.cupel/cache/coverage/` holds the report a real run of this command
# left, which every run ingests while it is fresh (ADR-079). After changing a file here, delete that
# cache and run `cupel check --only tests.mutation` here with the tool installed, then commit the new cache.
[lang.clojure]
coverage = "clojure -Sdeps '{:deps {cloverage/cloverage {:mvn/version \"1.2.4\"}}}' -M:test -m cloverage.coverage --src-ns-path src --test-ns-path test --lcov --no-html --no-summary"
