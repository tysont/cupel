[package]
name = "ledger"
version = "0.1.0"
edition = "2021"

# A workspace of its own, so cargo never looks for one above the fixture.
[workspace]

[dependencies]
contracts = "=0.6.11"

# The project's own test runs leave `debug_*` contracts unchecked; the contract run turns them on.
[profile.dev]
debug-assertions = false
