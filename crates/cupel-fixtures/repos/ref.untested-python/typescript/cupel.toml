# The Python reference plugins (ADR-092): the producer makes the per-test map TypeScript has no
# native producer for, and the check reads it. `plugins` links to crates/cupel-fixtures/plugins.
[scope]
exclude = ["plugins/**"]

[plugins]
ref-check = ["python3", "plugins/python/check.py"]
ref-produce = ["python3", "plugins/python/produce.py"]
