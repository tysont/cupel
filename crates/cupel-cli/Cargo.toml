# ABOUTME: Manifest for the `cupel` binary: argument parsing, rendering, and exit codes.
# ABOUTME: The only crate allowed to depend on every other Cupel crate.
[package]
name = "cupel-cli"
description = "The cupel command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `cargo binstall` downloads the release archive dist/targets.toml names instead of building (ADR-125).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cupel-{ version }-{ target }.tar.gz"
bin-dir = "cupel-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/cupel-{ version }-{ target }.zip"
pkg-fmt = "zip"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cupel"
path = "src/main.rs"

[dependencies]
cupel-adapt.workspace = true
cupel-mutate.workspace = true
cupel-checks.workspace = true
cupel-core.workspace = true
cupel-lang.workspace = true
cupel-plugin.workspace = true
cupel-serve.workspace = true
cupel-store.workspace = true
clap.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[dev-dependencies]
cupel-fixtures.workspace = true
inventory.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
insta.workspace = true
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
