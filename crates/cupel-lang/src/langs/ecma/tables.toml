# ABOUTME: Tables the generic producers read for javascript and typescript, alongside its queries.
# ABOUTME: Keys and shapes are documented in the cupel-lang crate docs; unknown keys are errors.

[namespace]
separator = "."
source_roots = ["src"]
index_files = ["index"]

[visibility]
default = "private"
# TypeScript accessibility modifiers. `protected` members are not callable from outside the
# class hierarchy, so they count as private.
modifiers = { "public" = "public", "protected" = "private", "private" = "private" }
