# ABOUTME: Tables the generic producers read for python, alongside its queries.
# ABOUTME: Keys and shapes are documented in the cupel-lang crate docs; unknown keys are errors.

# `src/ledger/report/format.py` is `ledger.report.format`; a package's `__init__.py` is the package.
[namespace]
separator = "."
source_roots = ["src"]
index_files = ["__init__"]

# Dunder names are protocol methods; `__name` is mangled to its class; `_name` is internal by
# convention (PEP 8). symbols.scm fixes `__all__` and nested definitions outright (ADR-034).
[visibility]
default = "public"

[[visibility.names]]
prefix = "__"
suffix = "__"
visibility = "public"

[[visibility.names]]
prefix = "__"
visibility = "private"

[[visibility.names]]
prefix = "_"
visibility = "internal"

# `elif` is an `elif_clause` directly under the `if_statement` whose chain it continues.
[decisions]
chain_parents = ["if_statement"]

# Annotations, decorators, and the return arrow say nothing about what a function does, so an
# annotated function and its unannotated twin normalize alike. Strings are literals, f-strings
# included. langs/python/normalize.rs then drops docstrings and `self`/`cls` (ADR-034).
[normalize]
identifiers = ["identifier"]
literals = [
  "integer",
  "float",
  "string",
  "concatenated_string",
  "true",
  "false",
  "none",
  "ellipsis",
]
erase = ["decorator", "type", "->"]
flatten = [
  "decorated_definition",
  "typed_parameter",
  "default_parameter",
  "typed_default_parameter",
]
operators = ["and", "or", "not", "in", "is", "is not", "not in"]
# `self.items.append(x)` keeps `append`; `self.items` is a receiver and normalizes as usual.
receivers = ["object"]

[[normalize.calls]]
kind = "call"
callee = "function"

[mutations.relational]
replace = { "<" = ["<="], "<=" = ["<"], ">" = [">="], ">=" = [">"] }

[mutations.equality]
replace = { "==" = ["!="], "!=" = ["=="], "is" = ["is not"], "is not" = ["is"] }

[mutations.arith-add-sub]
replace = { "+" = ["-"], "-" = ["+"], "+=" = ["-="], "-=" = ["+="] }

[mutations.arith-mul-div]
replace = { "*" = ["/"], "/" = ["*"], "//" = ["*"], "*=" = ["/="], "/=" = ["*="], "//=" = ["*="] }

[mutations.boolean-op]
replace = { "and" = ["or"], "or" = ["and"] }

[mutations.boolean-literal]
replace = { "True" = ["False"], "False" = ["True"] }

[mutations.zero-one]
replace = { "0" = ["1"], "1" = ["0"] }

[mutations.statement-deletion]
templates = ["pass"]

[mutations.return-value]
templates = ["None"]

[mutations.constant]
templates = ["0"]

[mutations.boundary]
templates = ["{} + 1", "{} - 1"]

[mutations.negation]
templates = ["not ({})"]
