# ABOUTME: Tables the generic producers read for rust, alongside its queries.
# ABOUTME: Keys and shapes are documented in the cupel-lang crate docs; unknown keys are errors.

[namespace]
separator = "::"
source_roots = ["src"]
index_files = ["lib", "main", "mod"]

[visibility]
default = "private"
modifiers = { "pub" = "public", "pub(self)" = "private" }
# pub(crate), pub(super), pub(in path): visible inside the crate, not exported.
modifier_default = "internal"

# `else if` is an `if_expression` inside the `else_clause` of the branch it continues.
[decisions]
chain_parents = ["else_clause"]

[normalize]
identifiers = [
  "identifier",
  "field_identifier",
  "type_identifier",
  "shorthand_field_identifier",
  "lifetime",
]
literals = [
  "integer_literal",
  "float_literal",
  "string_literal",
  "raw_string_literal",
  "char_literal",
  "boolean_literal",
]
# Attributes and visibility say nothing about what a function does.
erase = ["attribute_item", "inner_attribute_item", "visibility_modifier"]
# `self.items.push(x)` keeps `push`; `self.items` is a receiver and normalizes as usual.
receivers = ["value"]

[[normalize.calls]]
kind = "call_expression"
callee = "function"

[[normalize.calls]]
kind = "macro_invocation"
callee = "macro"

[mutations.relational]
replace = { "<" = ["<="], "<=" = ["<"], ">" = [">="], ">=" = [">"] }

[mutations.equality]
replace = { "==" = ["!="], "!=" = ["=="] }

[mutations.arith-add-sub]
replace = { "+" = ["-"], "-" = ["+"], "+=" = ["-="], "-=" = ["+="] }

[mutations.arith-mul-div]
replace = { "*" = ["/"], "/" = ["*"], "*=" = ["/="], "/=" = ["*="] }

[mutations.boolean-op]
replace = { "&&" = ["||"], "||" = ["&&"] }

[mutations.boolean-literal]
replace = { "true" = ["false"], "false" = ["true"] }

[mutations.zero-one]
replace = { "0" = ["1"], "1" = ["0"] }

[mutations.statement-deletion]
templates = [""]

# Every returned type a mutant can compile against implements Default far more often than not;
# a mutant that does not compile is reported as such by the mutation engine.
[mutations.return-value]
templates = ["Default::default()"]

[mutations.constant]
templates = ["0"]

[mutations.boundary]
templates = ["{} + 1", "{} - 1"]

[mutations.negation]
templates = ["!({})"]

[tests]
framework = "rust-test"

[tests.assertions]
assert_eq = { kind = "equality", strength = "strong" }
debug_assert_eq = { kind = "equality", strength = "strong" }
prop_assert_eq = { kind = "equality", strength = "strong" }
# Inequality rules out one value and allows every other: weak.
assert_ne = { kind = "equality", strength = "weak" }
debug_assert_ne = { kind = "equality", strength = "weak" }
prop_assert_ne = { kind = "equality", strength = "weak" }
assert = { kind = "truthiness", strength = "weak" }
debug_assert = { kind = "truthiness", strength = "weak" }
prop_assert = { kind = "truthiness", strength = "weak" }
assert_snapshot = { kind = "snapshot", strength = "strong" }
assert_debug_snapshot = { kind = "snapshot", strength = "strong" }
assert_display_snapshot = { kind = "snapshot", strength = "strong" }
assert_json_snapshot = { kind = "snapshot", strength = "strong" }
assert_yaml_snapshot = { kind = "snapshot", strength = "strong" }
# Idioms captured as @assertion.idiom.<key>.
equal = { kind = "equality", strength = "strong" }
not-equal = { kind = "equality", strength = "weak" }
one-value = { kind = "equality", strength = "strong" }
process = { kind = "custom", strength = "strong" }
is-present = { kind = "not-null", strength = "weak" }
is-err = { kind = "throws", strength = "weak" }
should-panic = { kind = "throws", strength = "strong" }
# A property check (`quickcheck(…)`, a `#[quickcheck]` function's result) fails the test with
# the shrunk counterexample (ADR-095).
property = { kind = "custom", strength = "strong" }

[conventions]
test_globs = ["**/tests/**/*.rs"]

# An integration test named after the module it tests.
[[conventions.tests_for]]
template = "{base}tests/{stem}.rs"

# The crate root is tested by every integration test.
[[conventions.tests_for]]
template = "{base}tests/*.rs"
stems = ["lib"]

# A module with a test module inside it tests itself.
[[conventions.tests_for]]
template = "{path}"
contains = "#[cfg(test)]"

# Attributes that only instruct the compiler, rustdoc, or a linter are not references to what they
# are on; `use a::b` binds `b` (ADR-135).
[references]
inert = ["allow", "warn", "deny", "expect", "inline", "cold", "must_use", "doc", "deprecated", "track_caller", "cfg", "cfg_attr"]
path_imports = true

[roots]
entry_points = ["main"]

# Property stubs `check --scaffold` writes (ADR-096 §4): an ignored proptest test in an inline test
# module of the function's own file, one strategy per parameter; a parameter type this table does
# not map gets no stub.
[property_stubs]
target = "source"
marker = "mod {name}_properties"
stub = """

#[cfg(test)]
mod {name}_properties {
    use super::*;
    use proptest::prelude::*;

    proptest! {
        #[test]
        #[ignore = "state the property `{name}` keeps, then remove this attribute"]
        fn {name}_property({bindings}) {
            let _ = {name}({passed});
        }
    }
}
"""
borrow = "&"

[property_stubs.types]
i8 = "any::<i8>()"
i16 = "any::<i16>()"
i32 = "any::<i32>()"
i64 = "any::<i64>()"
i128 = "any::<i128>()"
isize = "any::<isize>()"
u8 = "any::<u8>()"
u16 = "any::<u16>()"
u32 = "any::<u32>()"
u64 = "any::<u64>()"
u128 = "any::<u128>()"
usize = "any::<usize>()"
f32 = "any::<f32>()"
f64 = "any::<f64>()"
bool = "any::<bool>()"
char = "any::<char>()"
String = "any::<String>()"
str = "any::<String>()"
