# ABOUTME: Tables the generic producers read for go, alongside its queries.
# ABOUTME: Keys and shapes are documented in the cupel-lang crate docs; unknown keys are errors.

[namespace]
separator = "."

# Capitalized names are exported; everything else is visible throughout the package, which is
# what `internal` means (ADR-032). Go has no narrower level, so nothing is `private`. Exported
# names in `internal/` directories stay `public`: they are visible outside their package, and
# the import restriction is a module-boundary rule that a name rule cannot see.
[visibility]
default = "internal"

[[visibility.names]]
capitalized = true
visibility = "public"

# `else if` is an `if_statement` in the `alternative` field of the branch it continues.
[decisions]
chain_parents = ["if_statement"]

# Types are names like any other, so `int64` and `Money` both become `$id`. A method's receiver
# is an ordinary parameter list: its names normalize away and its shape (pointer or value) stays,
# so no hand-written override is needed for receivers.
[normalize]
identifiers = [
  "identifier",
  "field_identifier",
  "type_identifier",
  "package_identifier",
  "label_name",
]
literals = [
  "int_literal",
  "float_literal",
  "imaginary_literal",
  "rune_literal",
  "interpreted_string_literal",
  "raw_string_literal",
  "true",
  "false",
]
# `strings.ToUpper(s)` and `w.Close()` keep the function name; the package or value before the
# dot is a receiver and normalizes as usual.
receivers = ["operand"]

[[normalize.calls]]
kind = "call_expression"
callee = "function"

[mutations.relational]
replace = { "<" = ["<="], "<=" = ["<"], ">" = [">="], ">=" = [">"] }

[mutations.equality]
replace = { "==" = ["!="], "!=" = ["=="] }

[mutations.arith-add-sub]
replace = { "+" = ["-"], "-" = ["+"], "+=" = ["-="], "-=" = ["+="], "++" = ["--"], "--" = ["++"] }

[mutations.arith-mul-div]
replace = { "*" = ["/"], "/" = ["*"], "*=" = ["/="], "/=" = ["*="] }

[mutations.boolean-op]
replace = { "&&" = ["||"], "||" = ["&&"] }

[mutations.boolean-literal]
replace = { "true" = ["false"], "false" = ["true"] }

[mutations.zero-one]
replace = { "0" = ["1"], "1" = ["0"] }

[mutations.statement-deletion]
templates = [""]

# Go has no zero value that fits every type. `nil` fits errors, pointers, slices, maps,
# channels, functions, and interfaces, which covers the values Go code returns most; a mutant
# returning `nil` for another type does not compile and the mutation engine reports it so.
[mutations.return-value]
templates = ["nil"]

[mutations.constant]
templates = ["0"]

[mutations.boundary]
templates = ["{} + 1", "{} - 1"]

[mutations.negation]
templates = ["!({})"]
