# ABOUTME: The toolchain table (design §8.7, ADR-036): per language, launchers, runners, coverage and
# ABOUTME: bench producers, and analyzers in default order with detection rules and default commands; see the crate docs.

# Presence probes for programs whose `--version` does not work; every other program is probed
# with `<program> --version`.
[probes]
go = "go version"

# What to do by hand for the programs of a language toolchain, which Cupel never installs. Every
# other tool producer's row names an `install` command, filled with the launcher's values (ADR-081).
[toolchains]
cargo = "cargo is part of the Rust toolchain, which Cupel does not install: install Rust with rustup (https://rustup.rs) and put cargo on PATH."
go = "go is the Go toolchain, which Cupel does not install: install Go from https://go.dev/dl/ and put go on PATH."
python3 = "python3 is the Python toolchain, which Cupel does not install: install Python 3 from https://www.python.org/downloads/ or a package manager and put python3 on PATH."
mvn = "mvn is Apache Maven, which Cupel does not install: install a JDK and Maven from https://maven.apache.org/download.cgi or a package manager and put mvn on PATH."
gradle = "gradle is the Gradle build tool, which Cupel does not install: install a JDK and Gradle from https://gradle.org/install/ or a package manager and put gradle on PATH."
clojure = "clojure is the Clojure CLI, which Cupel does not install: install a JDK and the CLI from https://clojure.org/guides/install_clojure and put clojure on PATH."

# --- JavaScript and TypeScript ------------------------------------------------------------------

[[rows]]
langs = ["javascript", "typescript"]
property = ["fast-check"]
fuzz = ["jazzer.js"]
race = []

[[rows.launchers]]
tool = "pnpm"
detect = [
  { file = "pnpm-lock.yaml" },
  { file = "pnpm-workspace.yaml" },
  { json = "package.json", path = ["packageManager"], prefix = "pnpm@" },
]
values = { x = "pnpm", run = "pnpm run", add = "pnpm add --save-dev" }

[[rows.launchers]]
tool = "yarn"
detect = [
  { file = "yarn.lock" },
  { json = "package.json", path = ["packageManager"], prefix = "yarn@" },
]
values = { x = "yarn", run = "yarn run", add = "yarn add --dev" }

[[rows.launchers]]
tool = "npm"
values = { x = "npx", run = "npm run", add = "npm install --save-dev" }

[[rows.runners]]
id = "tool.vitest"
detect = [
  { json = "package.json", path = ["dependencies", "vitest"], members = true },
  { json = "package.json", path = ["devDependencies", "vitest"], members = true },
]
command = "<x> vitest run"
install = "<add> vitest"

[[rows.runners]]
id = "tool.jest"
detect = [
  { json = "package.json", path = ["dependencies", "jest"], members = true },
  { json = "package.json", path = ["devDependencies", "jest"], members = true },
]
command = "<x> jest"
install = "<add> jest"

[[rows.runners]]
id = "tool.mocha"
detect = [
  { json = "package.json", path = ["dependencies", "mocha"], members = true },
  { json = "package.json", path = ["devDependencies", "mocha"], members = true },
]
command = "<x> mocha"

[[rows.runners]]
id = "tool.node-test"
command = "node --test"

[[rows.coverage]]
id = "tool.vitest-coverage"
format = "lcov"
commands = { "tool.vitest" = "<x> vitest run --coverage --coverage.reporter=lcov" }
install = "<add> vitest @vitest/coverage-v8"

[[rows.coverage]]
id = "tool.jest-coverage"
format = "lcov"
commands = { "tool.jest" = "<x> jest --coverage --coverageReporters=lcov" }
install = "<add> jest"

[[rows.coverage]]
id = "tool.c8"
format = "lcov"
commands = { "tool.mocha" = "<x> c8 --reporter=lcov mocha", "tool.node-test" = "<x> c8 --reporter=lcov node --test" }
install = "<add> c8"

[[rows.bench]]
id = "tool.bench-script"
detect = [{ json = "package.json", path = ["scripts", "bench"] }]
command = "<run> bench"

# Analyzers (ADR-102): the type checker runs for TypeScript only; ESLint runs where the root has
# a flat config, and is `unconfigured` elsewhere.
[[rows.analyzers]]
id = "tool.tsc"
command = "<x> tsc --noEmit --strict --pretty false"
install = "<add> typescript"

[[rows.analyzers]]
id = "tool.eslint"
detect = [
  { file = "eslint.config.js" },
  { file = "eslint.config.mjs" },
  { file = "eslint.config.cjs" },
  { file = "eslint.config.ts" },
  { file = "eslint.config.mts" },
  { file = "eslint.config.cts" },
]
command = "<x> eslint --format json"
install = "<add> eslint"

# --- Python -------------------------------------------------------------------------------------

[[rows]]
langs = ["python"]
property = ["hypothesis"]
fuzz = ["atheris"]
race = []

[[rows.launchers]]
tool = "uv"
detect = [{ file = "uv.lock" }, { contains = "[tool.uv", in = "pyproject.toml" }]
values = { m = "uv run python -m", add = "uv add --dev" }

[[rows.launchers]]
tool = "poetry"
detect = [{ file = "poetry.lock" }, { contains = "[tool.poetry", in = "pyproject.toml" }]
values = { m = "poetry run python -m", add = "poetry add --group dev" }

[[rows.launchers]]
tool = "pip"
values = { m = "python -m", add = "python -m pip install" }

[[rows.runners]]
id = "tool.pytest"
detect = [
  { mentions = "pytest", in = ["pyproject.toml", "setup.cfg", "requirements*.txt"] },
  { file = "pytest.ini" },
  { file = "conftest.py" },
]
command = "<m> pytest"
install = "<add> pytest"

[[rows.runners]]
id = "tool.unittest"
command = "<m> unittest"

[[rows.coverage]]
id = "tool.pytest-cov"
format = "lcov"
commands = { "tool.pytest" = "<m> pytest --cov --cov-report=lcov:{out}" }
install = "<add> pytest-cov"

[[rows.coverage]]
id = "tool.coverage-py"
format = "lcov"
commands = { "tool.unittest" = "<m> coverage run -m unittest && <m> coverage lcov -o {out}" }
install = "<add> coverage"

[[rows.bench]]
id = "tool.pytest-benchmark"
detect = [
  { mentions = "pytest-benchmark", in = ["pyproject.toml", "setup.cfg", "requirements*.txt"] },
]
commands = { "tool.pytest" = "<m> pytest --benchmark-only --benchmark-json={out}" }

[[rows.analyzers]]
id = "tool.mypy"
command = "<m> mypy --strict --output json"
install = "<add> mypy"

[[rows.analyzers]]
id = "tool.ruff"
command = "<m> ruff check --output-format json"
install = "<add> ruff"

# --- Rust ---------------------------------------------------------------------------------------

[[rows]]
langs = ["rust"]
property = ["proptest", "quickcheck"]
fuzz = ["cargo-fuzz"]
race = ["miri", "loom"]

[[rows.runners]]
id = "tool.cargo-nextest"
detect = [{ file = ".config/nextest.toml" }]
command = "cargo nextest run --workspace"
install = "cargo install cargo-nextest --locked"

[[rows.runners]]
id = "tool.cargo-test"
command = "cargo test --workspace"

[[rows.coverage]]
id = "tool.cargo-llvm-cov"
format = "lcov"
command = "cargo llvm-cov --lcov --output-path {out}"
install = "cargo install cargo-llvm-cov --locked && rustup component add llvm-tools-preview"

[[rows.bench]]
id = "tool.criterion"
detect = [{ mentions = "criterion", in = ["Cargo.toml"] }]
command = "cargo bench --bench {name} -- --save-baseline {id}"

[[rows.analyzers]]
id = "tool.clippy"
command = "cargo clippy --all-targets --message-format=json"
install = "rustup component add clippy"

# --- Go -----------------------------------------------------------------------------------------

[[rows]]
langs = ["go"]
property = ["testing/quick", "rapid"]
fuzz = ["go test -fuzz"]
race = ["go test -race"]

[[rows.runners]]
id = "tool.go-test"
command = "go test -json <packages>"

[[rows.coverage]]
id = "tool.go-coverprofile"
format = "coverprofile"
command = "go test -coverprofile={out} <packages>"

[[rows.bench]]
id = "tool.go-bench"
command = "go test -run=^$ -bench=. <packages>"

[[rows.analyzers]]
id = "tool.go-vet"
command = "go vet -json <packages>"

[[rows.analyzers]]
id = "tool.staticcheck"
command = "staticcheck -f json <packages>"
install = "go install honnef.co/go/tools/cmd/staticcheck@2024.1.1"

# --- Java (ADR-108) -----------------------------------------------------------------------------

[[rows]]
langs = ["java"]
property = ["jqwik"]
fuzz = ["jazzer"]
race = []

[[rows.runners]]
id = "tool.maven"
detect = [{ file = "pom.xml" }]
command = "mvn -B --no-transfer-progress test"

[[rows.runners]]
id = "tool.gradle"
command = "gradle test --console=plain"

# JaCoCo by coordinate needs no `pom.xml` change; under Gradle the build must apply the `jacoco`
# plugin with XML reports on.
[[rows.coverage]]
id = "tool.jacoco-maven"
format = "jacoco"
commands = { "tool.maven" = "mvn -B --no-transfer-progress org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.13:report" }

[[rows.coverage]]
id = "tool.jacoco-gradle"
format = "jacoco"
commands = { "tool.gradle" = "gradle test jacocoTestReport --console=plain" }

# --- Clojure (ADR-109) --------------------------------------------------------------------------

[[rows]]
langs = ["clojure"]
property = ["test.check"]
fuzz = []
race = []

[[rows.runners]]
id = "tool.clojure-test"
command = "clojure -M:test"

# Cloverage by coordinate needs no `deps.edn` change; it instruments `src` and runs `test`.
[[rows.coverage]]
id = "tool.cloverage"
format = "lcov"
commands = { "tool.clojure-test" = "clojure -Sdeps '{:deps {cloverage/cloverage {:mvn/version \"1.2.4\"}}}' -M:test -m cloverage.coverage --src-ns-path src --test-ns-path test --lcov --no-html --no-summary" }
