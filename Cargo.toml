# ABOUTME: Cargo workspace for Cupel: member crates, shared dependency versions, and lints.
# ABOUTME: Every dependency version is declared once here; member crates use `workspace = true`.
[workspace]
resolver = "3"
members = [
    "crates/cupel-cli",
    "crates/cupel-core",
    "crates/cupel-fixtures",
    "crates/cupel-lang",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "BSD-3-Clause"
repository = "https://github.com/tysont/cupel"

[workspace.dependencies]
cupel-core = { path = "crates/cupel-core" }
cupel-lang = { path = "crates/cupel-lang" }
cupel-fixtures = { path = "crates/cupel-fixtures" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = { version = "1.1.8", features = ["preserve_order"] }
schemars = "1.2.2"
blake3 = "1.8.7"
semver = "1.0.28"
ulid = "3.0.0"
thiserror = "2.0.21"
assert_cmd = "2.2.2"
predicates = "3.1.4"
insta = "1.49.0"
proptest = "1.11.0"
tempfile = "3.27.0"
# 2.x, not 3.x: the version insta already resolves to, so the build carries one copy (ADR-003).
similar = "2.7.0"
# Parsing. tree-sitter 0.27 reads grammar ABI 13–15; the TypeScript grammars are ABI 14, the rest 15.
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
ignore = "0.4.33"
globset = "0.4.20"
rayon = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints opted out workspace-wide; see the P0 Notes in docs/CUPEL_IMPLEMENTATION_PLAN.md.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
