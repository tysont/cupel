# ABOUTME: Cargo workspace for Cupel: member crates, shared dependency versions, and lints.
# ABOUTME: Every dependency version is declared once here; member crates use `workspace = true`.
[workspace]
resolver = "3"
members = ["crates/cupel-cli", "crates/cupel-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "BSD-3-Clause"
repository = "https://github.com/tysont/cupel"

[workspace.dependencies]
cupel-core = { path = "crates/cupel-core" }
clap = { version = "4.6.7", features = ["derive"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints opted out workspace-wide; see the P0 Notes in docs/CUPEL_IMPLEMENTATION_PLAN.md.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
