# ABOUTME: Cargo workspace for Cupel: member crates, shared dependency versions, and lints.
# ABOUTME: Every dependency version is declared once here; member crates use `workspace = true`.
[workspace]
resolver = "3"
members = [
    "crates/cupel-adapt",
    "crates/cupel-checks",
    "crates/cupel-cli",
    "crates/cupel-core",
    "crates/cupel-fixtures",
    "crates/cupel-lang",
    "crates/cupel-mutate",
    "crates/cupel-plugin",
    "crates/cupel-serve",
    "crates/cupel-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "BSD-3-Clause"
repository = "https://github.com/tysont/cupel"

[workspace.dependencies]
cupel-adapt = { path = "crates/cupel-adapt" }
cupel-checks = { path = "crates/cupel-checks" }
cupel-core = { path = "crates/cupel-core" }
cupel-lang = { path = "crates/cupel-lang" }
cupel-mutate = { path = "crates/cupel-mutate" }
cupel-plugin = { path = "crates/cupel-plugin" }
cupel-serve = { path = "crates/cupel-serve" }
cupel-store = { path = "crates/cupel-store" }
cupel-fixtures = { path = "crates/cupel-fixtures" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = { version = "1.1.8", features = ["preserve_order"] }
# `oracle add` and `oracle remove` edit cupel.toml in place, keeping comments and order (ADR-090).
toml_edit = "0.25.17"
schemars = "1.2.2"
blake3 = "1.8.7"
semver = "1.0.28"
ulid = "3.0.0"
thiserror = "2.0.21"
assert_cmd = "2.2.2"
predicates = "3.1.4"
insta = "1.49.0"
proptest = "1.11.0"
tempfile = "3.27.0"
nix = { version = "0.31.3", features = ["signal"] }
# The daemon's named pipes on Windows (ADR-137); already in the lock through notify and others.
windows-sys = "0.61.2"
# 2.x, not 3.x: the version insta already resolves to, so the build carries one copy (ADR-003).
similar = "2.7.0"
# Parsing. tree-sitter 0.27 reads grammar ABI 13–15; the TypeScript, Java, and Clojure grammars are ABI 14,
# the rest 15. The Clojure grammar is grammar-orchard's fork of sogaiu's, which depends on no tree-sitter
# version of its own (ADR-109).
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-clojure-orchard = "0.2.8"
ignore = "0.4.33"
globset = "0.4.20"
rayon = "1.12.0"
# Checks and producers register themselves from their own modules (ADR-074).
inventory = "0.3.25"
# The fact store (ADR-045); `bundled` compiles SQLite in, so no system library is needed.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The daemon's file watcher (P4.2, ADR-085).
notify = "8.2.0"
# JUnit XML from pytest and cargo nextest (P3.1); read-only, no dependencies of its own.
roxmltree = "0.21.1"
# The fixture harness validates `--format sarif` output against the vendored SARIF 2.1.0 schema
# (P6.1); no default features, so it never fetches a remote schema. 0.46, not 0.47+: later versions
# turn on serde_json's `float_roundtrip`, which feature unification would put into the `cupel` binary
# the tests run, changing the last digit of parsed coverage floats in goldens.
jsonschema = { version = "0.46.10", default-features = false }
# The matrix test's harness: one trial per (check, language), derived from the registries at run time,
# so each pair is a test of its own that nextest runs in its own process (ADR-129).
libtest-mimic = "0.8.2"

# Release binaries ship without symbols (ADR-124); `make dist` and `make install` build this profile.
[profile.release]
strip = true

[workspace.lints.rust]
# `deny`, not `forbid`: the Windows named-pipe transport is the one module that allows it (ADR-137).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints opted out workspace-wide; see the P0 Notes in docs/CUPEL_IMPLEMENTATION_PLAN.md.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
