# ABOUTME: Packaging for the `cupel-cli` Python distribution (ADR-125, ADR-146), which pipx installs: one standard-library
# ABOUTME: module, `cupel`, whose `cupel` console script downloads and runs this platform's release binary.
[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cupel-cli"
# The version and description come from cupel.py's `__version__` and docstring.
dynamic = ["version", "description"]
license = "BSD-3-Clause"
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/tysont/cupel"

[project.scripts]
cupel = "cupel:main"

# The module is `cupel.py`, not `cupel_cli.py`, the name flit would look for by default.
[tool.flit.module]
name = "cupel"
